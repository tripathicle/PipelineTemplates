parameters:
  - name: WorkingDirectory
    type: string
    default: 'WorkingDirectory'

  - name: ServiceConnectionName
    type: string
    default: 'ServiceConnectionName'

  - name: StorageAccountName
    type: string
    default: 'StorageAccountName'

  - name: ContainerName
    type: string
    default: 'ContainerName'

  - name: ContainerKey
    type: string
    default: 'ContainerKey'

# Declaration of the stages in the pipeline

stages:
  - stage: templates_init_stage
    displayName: 'Initialize the templates'
    jobs:
      - job: templates_init_job
        displayName: 'initialize the templates'
        steps:
         - task: TerraformInstaller@1
           inputs:
             terraformVersion: 'latest'

          - task: TerraformTask@5
            displayName: 'Initialize the templates'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '${{ parameters.WorkingDirectory }}'
              backendServiceArm: '${{ parameters.ServiceConnectionName }}'
              backendAzureRmResourceGroupName: '${{ parameters.StorageAccountName }}'
              backendAzureRmStorageAccountName: '${{ parameters.StorageAccountName }}'
              backendAzureRmContainerName: '${{ parameters.ContainerName }}'
              backendAzureRmKey: '${{ parameters.ContainerKey }}'